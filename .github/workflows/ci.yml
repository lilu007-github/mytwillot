name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test utils
        run: pnpm test -- --run
        working-directory: packages/utils

      - name: Test x-bookmarks
        run: pnpm test -- --run
        working-directory: x-bookmarks

      - name: Test exporter
        run: pnpm test -- --run
        working-directory: exporter

      - name: Test x-bookmarks-automation
        run: pnpm test -- --run
        working-directory: x-bookmarks-automation

      - name: Build x-bookmarks
        run: pnpm build
        working-directory: x-bookmarks

      - name: Build exporter
        run: pnpm build
        working-directory: exporter

      - name: Build x-bookmarks-automation
        run: pnpm build
        working-directory: x-bookmarks-automation
